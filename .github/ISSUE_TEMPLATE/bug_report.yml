name: 问题反馈
description: 登录、同步、提醒或界面出现问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先隐藏账号、手机号、学号、Cookie、验证码和链接中的登录参数。安全漏洞请按 SECURITY.md 私密报告。
  - type: input
    id: version
    attributes:
      label: 课期版本
      placeholder: "例如 0.10.0；官方 APK 或自行构建"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机、系统与 WebView 版本
      placeholder: "例如 iQOO / OriginOS；Android System WebView 版本"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 学习通登录或同步
        - MOOC 登录或同步
        - 课程管理或筛选
        - 截止提醒或后台
        - 界面或其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、实际结果与预期结果
      description: 按操作顺序描述；同步问题请附脱敏摘要，并说明官方平台是否有对应任务。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或错误
      description: 不上传登录页面输入、数据库、原始网页或完整会话链接。
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据检查
      options:
        - label: 已确认反馈中不包含密码、Cookie、验证码、学号、手机号或签名密钥。
          required: true
