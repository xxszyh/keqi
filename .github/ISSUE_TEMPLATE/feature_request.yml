name: 功能建议
description: 描述要解决的使用问题
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 什么场景不方便？
      description: 描述操作过程、影响和使用频率。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改进？
      description: 可提供示意或参考，避免真实课程和账号信息。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他可行办法
      description: 可选，说明当前如何处理。
