name: Checks and Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Android SDK packages
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkManager 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python mobile/configure_tools.py
      - name: Check repository
        run: python scripts/check_repo.py
      - name: Run isolated regressions
        run: python mobile/run_checks.py
      - name: Build development APK
        run: python mobile/build.py --output-dir mobile/build/ci
      - name: Upload development build (own debug signature)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keqi-development-${{ github.sha }}
          path: |
            mobile/build/ci/*.apk
            mobile/build/ci/build-info.json
          if-no-files-found: error
          retention-days: 7
